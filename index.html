<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABYLON - 신앙의 여정</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #1e1512; }
    .font-medieval { font-family: 'Cinzel', 'Noto Serif KR', serif; }
    
    .wood-bg { background: linear-gradient(135deg, #1e1512 0%, #0d0705 100%); }
    .parchment-panel { background: linear-gradient(to bottom right, #2f221a, #1f140e); }
    
    .gold-text { background: linear-gradient(to bottom, #fada5e, #d4af37, #996515); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .wax-seal { background: radial-gradient(circle at 30% 30%, #b71c1c, #7f0000); box-shadow: inset 0 0 10px rgba(0,0,0,0.7), 0 4px 6px rgba(0,0,0,0.8); }
    .stone-slot { background: #140b08; box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.05); border: 2px solid #3e2723; }
    
    .medieval-btn { background: linear-gradient(to bottom, #4e342e, #2b1b17); border: 2px solid #795548; box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.05); color: #e6d5c3; transition: all 0.2s; }
    .medieval-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #5d4037, #3e2723); border-color: #8d6e63; }
    .medieval-btn:active:not(:disabled) { background: #2b1b17; box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); transform: translateY(2px); }
    .medieval-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .gold-btn { background: linear-gradient(to bottom, #d4af37, #aa8000); border: 2px solid #ffe066; color: #1a110c; text-shadow: 0 1px 1px rgba(255,255,255,0.3); box-shadow: 0 4px 8px rgba(0,0,0,0.7); transition: all 0.2s; }
    .gold-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #e5c158, #b8860b); }
    .gold-btn:active:not(:disabled) { background: #996515; transform: translateY(2px); box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); }
    .gold-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(50%); }
    
    .blood-btn { background: linear-gradient(to bottom, #990000, #5c0000); border: 2px solid #ff5252; color: #ffebee; box-shadow: 0 4px 8px rgba(0,0,0,0.7); transition: all 0.2s; }
    .blood-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #b71c1c, #7f0000); }
    .blood-btn:active:not(:disabled) { background: #5c0000; transform: translateY(2px); box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); }
    .blood-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .royal-btn { background: linear-gradient(to bottom, #1565c0, #0d47a1); border: 2px solid #82b1ff; color: #e3f2fd; box-shadow: 0 4px 8px rgba(0,0,0,0.7); transition: all 0.2s; }
    .royal-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #1976d2, #1565c0); }
    .royal-btn:active:not(:disabled) { background: #0a3a82; transform: translateY(2px); box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); }
    .royal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .medieval-input { background: rgba(0,0,0,0.6); border: 2px solid #4e342e; color: #f5deb3; text-transform: uppercase; }
    .medieval-input:focus { border-color: #d4af37; outline: none; box-shadow: 0 0 10px rgba(212,175,55,0.3); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-in-out; }
    @keyframes slideInDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slideInDown { animation: slideInDown 0.3s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen wood-bg text-[#e6d5c3] font-medieval overflow-x-hidden flex justify-center">

  <div id="app" class="w-full max-w-md relative pt-12 p-4 sm:p-6 pb-20">
    <div class="flex items-center justify-center h-64">
      <i data-lucide="loader-2" class="w-12 h-12 text-[#d4af37] animate-spin"></i>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase Initialization ---
    const firebaseConfig = {
    	apiKey: "AIzaSyDOVJQHcvvk3kN3hVy-krXNRvBdvmNkrxM",
   	  authDomain: "babylon-15548.firebaseapp.com",
    	projectId: "babylon-15548",
    	storageBucket: "babylon-15548.firebasestorage.app",
    	messagingSenderId: "177872947585",
    	appId: "1:177872947585:web:5a33b674f5b9a1a2e6c080"
	  };
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- 게임 설정 상수 ---
    const MIN_PLAYERS = 5;
    const MAX_PLAYERS = 10;

    const GOOD_ROLES_ORDER = [
      { roleId: 'moses', characterName: '모세', role: '멀린', desc: '느부갓네살을 제외한 악 진영이 누구인지 알고 있습니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Moses%20parting%20the%20sea?width=400&height=400&nologo=true&seed=1' },
      { roleId: 'daniel', characterName: '다니엘', role: '퍼시벌', desc: '모세와 이세벨의 정체를 알지만, 누가 진짜 모세인지는 모릅니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Daniel%20in%20lion%20den?width=400&height=400&nologo=true&seed=2' },
      { roleId: 'esther', characterName: '에스더', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Queen%20Esther%20beautiful?width=400&height=400&nologo=true&seed=3' },
      { roleId: 'jacob', characterName: '야곱', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Jacob%20wrestling%20angel?width=400&height=400&nologo=true&seed=4' },
      { roleId: 'noah', characterName: '노아', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Noah%20and%20ark?width=400&height=400&nologo=true&seed=5' },
      { roleId: 'abraham', characterName: '아브라함', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20patriarch%20Abraham%20looking%20at%20stars?width=400&height=400&nologo=true&seed=6' }
    ];

    const EVIL_ROLES_ORDER = [
      { roleId: 'herod', characterName: '헤롯', role: '암살자', desc: '악 진영의 정체를 압니다. 게임 패배 시 모세를 암살하면 역전승합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20evil%20King%20Herod%20angry?width=400&height=400&nologo=true&seed=7' },
      { roleId: 'jezebel', characterName: '이세벨', role: '모르가나', desc: '악 진영의 정체를 압니다. 다니엘에게 모세처럼 보입니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20wicked%20Queen%20Jezebel?width=400&height=400&nologo=true&seed=8' },
      { roleId: 'nebuchadnezzar', characterName: '느부갓네살', role: '모드레드', desc: '악 진영의 정체를 압니다. 모세에게 자신의 정체를 숨깁니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20King%20Nebuchadnezzar%20babylon?width=400&height=400&nologo=true&seed=9' },
      { roleId: 'pharaoh', characterName: '바로', role: '오베론', desc: '악 진영의 정체를 모두 압니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20Egyptian%20Pharaoh%20exodus?width=400&height=400&nologo=true&seed=10' }
    ];

    const ROLE_COUNTS = {
      5: [3, 2], 6: [4, 2], 7: [4, 3], 8: [5, 3], 9: [6, 3], 10: [6, 4]
    };

    const QUEST_SIZES = {
      5: [2, 3, 2, 3, 3], 6: [2, 3, 4, 3, 4], 7: [2, 3, 3, 4, 4],
      8: [3, 4, 4, 5, 5], 9: [3, 4, 4, 5, 5], 10: [3, 4, 4, 5, 5]
    };

    const shuffle = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // --- 글로벌 상태 ---
    let myUid = null;
    let localPlayerName = '';
    let roomCode = null;
    let isHost = false;
    let unsubscribeRoom = null;
    
    // 로컬 전용 UI 상태
    let appState = 'initializing'; // initializing, lobby, ingame
    let errorMsg = '';
    let uiState = {
      isSecretVisible: false,
      localAssassinationTarget: null
    };

    // Firestore 동기화 상태
    let roomState = {
      gameState: 'setup',
      players: [],
      leaderIndex: 0,
      currentRound: 0,
      rejectCount: 0,
      selectedTeam: [],
      votes: {},
      questCards: [],
      history: [],
      readyPlayers: [],
      winner: null,
      winReason: ''
    };

    // --- Auth Flow ---
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        showError("인증에 실패했습니다.");
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        myUid = user.uid;
        if (appState === 'initializing') {
          appState = 'lobby';
          render();
        }
      }
    });

    initAuth();

    // --- 헬퍼 함수 ---
    window.showError = (msg) => {
      errorMsg = msg;
      render();
      setTimeout(() => { errorMsg = ''; render(); }, 3000);
    };

    const updateRoom = async (updates) => {
      if (!myUid || !roomCode) return;
      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
      try {
        await updateDoc(roomRef, updates);
      } catch (e) {
        console.error("Update failed", e);
      }
    };

    const subscribeToRoom = () => {
      if (unsubscribeRoom) unsubscribeRoom();
      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
      
      unsubscribeRoom = onSnapshot(roomRef, (snapshot) => {
        if (snapshot.exists()) {
          roomState = snapshot.data();
          handleHostAutoTransitions();
          render();
        } else {
          showError("방이 삭제되었거나 존재하지 않습니다.");
          leaveRoomLocal();
        }
      }, (error) => {
        showError("연결 오류가 발생했습니다.");
      });
    };

    // --- 호스트 자동 진행 로직 ---
    const handleHostAutoTransitions = () => {
      if (!isHost) return;

      // 역할 확인 완료 처리
      if (roomState.gameState === 'reveal' && roomState.readyPlayers.length >= roomState.players.length) {
        updateRoom({ gameState: 'pre_discussion', readyPlayers: [] });
      }
      
      // 투표 완료 처리
      if (roomState.gameState === 'voting' && Object.keys(roomState.votes || {}).length >= roomState.players.length) {
        const approveCount = Object.values(roomState.votes).filter(v => v === 'approve').length;
        if (approveCount > roomState.players.length / 2) {
          updateRoom({ gameState: 'quest', questCards: [], readyPlayers: [] });
        } else {
          const newRejectCount = roomState.rejectCount + 1;
          if (newRejectCount >= 5) {
            updateRoom({ gameState: 'end', winner: 'evil', winReason: '5연속 신앙여정대 파견 부결로 인한 악 진영 승리!' });
          } else {
            updateRoom({
              gameState: 'pre_discussion',
              rejectCount: newRejectCount,
              leaderIndex: (roomState.leaderIndex + 1) % roomState.players.length,
              selectedTeam: [],
              votes: {},
              readyPlayers: []
            });
          }
        }
      }

      // 여정 카드 제출 완료 처리
      if (roomState.gameState === 'quest' && roomState.questCards.length >= roomState.selectedTeam.length) {
        // 이미 처리되었는지 방지 (questCards가 비워지기 전)
        if (roomState.readyPlayers.length === 0) return; 

        const failCount = roomState.questCards.filter(c => c === 'fail').length;
        const needsTwoFails = roomState.players.length >= 7 && roomState.currentRound === 3;
        const resultStatus = (needsTwoFails ? failCount >= 2 : failCount >= 1) ? 'fail' : 'success';

        const newHistory = [...(roomState.history || []), {
          round: roomState.currentRound,
          team: [...roomState.selectedTeam],
          votes: { ...roomState.votes },
          cards: shuffle([...roomState.questCards]),
          result: resultStatus,
          fails: failCount
        }];

        updateRoom({ 
          gameState: 'quest_result', 
          history: newHistory,
          readyPlayers: [] // 락 해제용
        });
      }
    };


    // --- 액션 핸들러 (창 객체에 바인딩) ---
    window.setLocalName = (e) => { localPlayerName = e.target.value.trim(); };
    window.setJoinCode = (e) => { e.target.value = e.target.value.toUpperCase(); };

    window.createRoom = async () => {
      if (!myUid) return;
      if (!localPlayerName) return showError("이름을 입력해주세요.");
      
      const code = Math.random().toString(36).substring(2, 6).toUpperCase();
      const initialData = {
        gameState: 'setup',
        players: [{ uid: myUid, name: localPlayerName, isHost: true }],
        leaderIndex: 0, currentRound: 0, rejectCount: 0,
        selectedTeam: [], votes: {}, questCards: [], history: [], readyPlayers: []
      };

      try {
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
        await setDoc(roomRef, initialData);
        roomCode = code;
        isHost = true;
        appState = 'ingame';
        subscribeToRoom();
      } catch (e) {
        showError("방 생성에 실패했습니다.");
      }
    };

    window.joinRoomAction = async () => {
      if (!myUid) return;
      const codeInput = document.getElementById('joinCodeInput');
      const code = codeInput ? codeInput.value.trim() : '';
      
      if (!localPlayerName) return showError("이름을 입력해주세요.");
      if (!code || code.length !== 4) return showError("올바른 4자리 코드를 입력해주세요.");

      try {
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
        const docSnap = await getDoc(roomRef);
        
        if (!docSnap.exists()) {
          return showError("존재하지 않는 방입니다.");
        }
        
        const data = docSnap.data();
        if (data.gameState !== 'setup') {
          return showError("이미 시작된 게임입니다.");
        }
        if (data.players.length >= MAX_PLAYERS) {
          return showError("방이 가득 찼습니다.");
        }
        if (data.players.some(p => p.name === localPlayerName)) {
          return showError("이미 사용 중인 이름입니다.");
        }

        await updateDoc(roomRef, {
          players: arrayUnion({ uid: myUid, name: localPlayerName, isHost: false })
        });

        roomCode = code;
        isHost = false;
        appState = 'ingame';
        subscribeToRoom();
      } catch (e) {
        showError("방 참여에 실패했습니다.");
      }
    };

    window.leaveRoomLocal = () => {
      if (unsubscribeRoom) unsubscribeRoom();
      roomCode = null;
      isHost = false;
      appState = 'lobby';
      uiState = { isSecretVisible: false, localAssassinationTarget: null };
      render();
    };

    window.startGame = async () => {
      if (!isHost || roomState.players.length < MIN_PLAYERS) return;
      
      const pCount = roomState.players.length;
      const [goodCount, evilCount] = ROLE_COUNTS[pCount];
      
      const goodRoles = GOOD_ROLES_ORDER.slice(0, goodCount).map(r => ({ ...r, team: 'good' }));
      const evilRoles = EVIL_ROLES_ORDER.slice(0, evilCount).map(r => ({ ...r, team: 'evil' }));
      
      const allRoles = shuffle([...goodRoles, ...evilRoles]);
      
      const assignedPlayers = shuffle(roomState.players).map((p, i) => ({
        ...p, id: p.uid, ...allRoles[i] // id 필드도 유지
      }));

      await updateRoom({
        gameState: 'reveal',
        players: assignedPlayers,
        leaderIndex: Math.floor(Math.random() * pCount),
        readyPlayers: []
      });
    };

    window.revealSecret = () => {
      uiState.isSecretVisible = true;
      render();
    };

    window.confirmReady = async () => {
      if (!myUid || roomState.readyPlayers.includes(myUid)) return;
      await updateRoom({ readyPlayers: arrayUnion(myUid) });
    };

    window.endPreDiscussion = async () => {
      const isLeader = roomState.players[roomState.leaderIndex].uid === myUid;
      if (!isLeader) return;
      await updateRoom({ gameState: 'board' });
    };

    window.toggleSelection = async (targetUid) => {
      const isLeader = roomState.players[roomState.leaderIndex].uid === myUid;
      if (!isLeader) return;
      
      const reqPlayers = QUEST_SIZES[roomState.players.length][roomState.currentRound];
      let newSelection = [...roomState.selectedTeam];
      
      const idx = newSelection.indexOf(targetUid);
      if (idx > -1) {
        newSelection.splice(idx, 1);
      } else if (newSelection.length < reqPlayers) {
        newSelection.push(targetUid);
      }
      
      await updateRoom({ selectedTeam: newSelection });
    };

    window.confirmTeam = async () => {
      const isLeader = roomState.players[roomState.leaderIndex].uid === myUid;
      if (!isLeader) return;
      
      const reqPlayers = QUEST_SIZES[roomState.players.length][roomState.currentRound];
      if (roomState.selectedTeam.length !== reqPlayers) return;

      if (roomState.currentRound === 0) {
        await updateRoom({ gameState: 'discussion' });
      } else {
        await updateRoom({ gameState: 'voting', votes: {}, readyPlayers: [] });
      }
    };

    window.startVoting = async () => {
      const isLeader = roomState.players[roomState.leaderIndex].uid === myUid;
      if (!isLeader) return;
      await updateRoom({ gameState: 'voting', votes: {}, readyPlayers: [] });
    };

    window.submitVote = async (voteType) => {
      if (!myUid || roomState.votes[myUid]) return;
      const updates = {};
      updates[`votes.${myUid}`] = voteType;
      await updateRoom(updates);
    };

    window.submitQuestCard = async (cardType) => {
      if (!myUid || roomState.readyPlayers.includes(myUid)) return;
      if (!roomState.selectedTeam.includes(myUid)) return;

      // 상태 업데이트를 한 번에 전송하여 레이스 컨디션 최소화
      await updateRoom({
        questCards: arrayUnion(cardType),
        readyPlayers: arrayUnion(myUid)
      });
    };

    window.proceedFromResult = async () => {
      if (!isHost) return;
      const goodWins = roomState.history.filter(h => h.result === 'success').length;
      const evilWins = roomState.history.filter(h => h.result === 'fail').length;

      if (goodWins >= 3) {
        await updateRoom({ gameState: 'evil_discussion' });
      } else if (evilWins >= 3) {
        await updateRoom({ gameState: 'end', winner: 'evil', winReason: '신앙여정 3회 실패로 악 진영 승리!' });
      } else {
        await updateRoom({
          gameState: 'pre_discussion',
          currentRound: roomState.currentRound + 1,
          rejectCount: 0,
          leaderIndex: (roomState.leaderIndex + 1) % roomState.players.length,
          selectedTeam: [],
          readyPlayers: []
        });
      }
    };

    window.endEvilDiscussion = async () => {
      const myPlayer = roomState.players.find(p => p.uid === myUid);
      if (!myPlayer || (myPlayer.roleId !== 'herod' && !isHost)) return;
      await updateRoom({ gameState: 'assassination' });
    };

    window.selectTarget = (uid) => {
      const myPlayer = roomState.players.find(p => p.uid === myUid);
      if (!myPlayer || myPlayer.roleId !== 'herod') return;
      uiState.localAssassinationTarget = uid;
      render();
    };

    window.confirmAssassination = async () => {
      const myPlayer = roomState.players.find(p => p.uid === myUid);
      if (!myPlayer || myPlayer.roleId !== 'herod' || !uiState.localAssassinationTarget) return;
      
      const targetPlayer = roomState.players.find(p => p.uid === uiState.localAssassinationTarget);
      if (targetPlayer.roleId === 'moses') {
        await updateRoom({ gameState: 'end', winner: 'evil', winReason: `헤롯이 모세(${targetPlayer.name})를 찾아내 암살했습니다. 악 진영 역전승!` });

        await updateRoom({ gameState: 'end', winner: 'good', winReason: `헤롯이 모세 암살에 실패했습니다. (지목: ${targetPlayer.name}) 선 진영 승리!` });

    };

    window.resetRoom = async () => {
      if (!isHost) return;
      await updateRoom({
        gameState: 'setup',
        currentRound: 0,
        rejectCount: 0,
        history: [],
        winner: null,
        winReason: '',
        leaderIndex: 0,
        selectedTeam: [],
        votes: {},
        questCards: [],
        readyPlayers: [],

      uiState = { isSecretVisible: false, localAssassinationTarget: null };
    };

    // --- 지식 가져오기 헬퍼 ---
    const getKnowledge = (player) => {
      if (player.roleId === 'moses') {
        const knownEvils = roomState.players.filter(p => p.team === 'evil' && p.roleId !== 'nebuchadnezzar').map(p => p.name);
        return knownEvils.length > 0 ? `악 진영 (느부갓네살 제외): ${knownEvils.join(', ')}` : '알려진 악 진영이 없습니다.';
      }
      if (player.roleId === 'daniel') {
        let targets = roomState.players.filter(p => p.roleId === 'moses' || p.roleId === 'jezebel').map(p => p.name);
        return `모세 혹은 이세벨: ${shuffle(targets).join(', ')}`;
      }
      if (player.team === 'evil') {
        const evils = roomState.players.filter(p => p.team === 'evil' && p.uid !== player.uid).map(p => `${p.name} (${p.characterName})`);
        return evils.length > 0 ? `악 진영 동료: ${evils.join(', ')}` : '당신 외에 악 진영 동료가 없습니다.';
      }
      return '특별히 알고 있는 정보가 없습니다.';
    };

    // --- UI 렌더러 ---
    const getErrorHTML = () => errorMsg ? `
      <div class="fixed top-4 left-0 right-0 z-[100] flex justify-center animate-slideInDown pointer-events-none">

        </div>
      </div>
    ` : '';

    const getTitleHTML = () => `

        <h2 class="text-lg text-[#bcaaa4] font-medieval uppercase tracking-widest border-b border-[#5d4037] pb-2 inline-block">온라인 성전</h2>
      </div>
    `;

    const renderLobby = () => {
      return getErrorHTML() + getTitleHTML() + `

          </div>

          <div class="space-y-4">

            </button>
            
            <div class="relative flex py-2 items-center">
              <div class="flex-grow border-t border-[#5d4037]"></div>

              <div class="flex-grow border-t border-[#5d4037]"></div>

            <div class="flex gap-2">

              <button onclick="joinRoomAction()" class="px-5 py-3 royal-btn font-bold text-lg whitespace-nowrap">참여</button>
            </div>

    const renderGame = () => {

                      확인 완료
                    </button>
                  `}
                </div>
              `}
            </div>
          </div>
        `;

      else if (roomState.gameState === 'pre_discussion') {
        content += `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-8 rounded-sm shadow-2xl text-center flex flex-col justify-center min-h-[450px] animate-fadeIn">

            <h2 class="text-3xl font-extrabold gold-text mb-2">여정대 지목 전 토론</h2>
            
            <div class="my-6">
              <h3 class="text-xl text-[#bcaaa4] mb-2 font-bold">이번 신앙여정 대장</h3>
              <div class="flex items-center justify-center gap-3">
                <i data-lucide="crown" class="w-8 h-8 text-[#d4af37] drop-shadow-md"></i>
                <p class="text-4xl font-extrabold text-[#f5deb3] drop-shadow-md">${currentLeader.name} ${isLeader ? '<span class="text-lg text-[#d4af37]">(나)</span>' : ''}</p>
              </div>
            </div>

            <p class="text-[#d7ccc8] mb-8 font-medium text-base leading-relaxed">대장이 여정대를 지목하기 전입니다.<br/>누구를 보낼지 자유롭게 대화하세요.</p>
            
            ${isLeader ? `
              <button onclick="endPreDiscussion()" class="w-full py-4 royal-btn font-bold text-xl">토론 종료 및 여정대 지목하기</button>
            ` : `
              <div class="p-4 stone-slot text-[#bcaaa4] font-bold rounded-sm">대장(${currentLeader.name})이 다음 단계로 넘어갈 수 있습니다.</div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'board' || roomState.gameState === 'select_team') {
        const reqPlayers = QUEST_SIZES[roomState.players.length][roomState.currentRound];
        
        content += `
          <div class="flex justify-between items-end mb-6 border-b-2 border-[#5d4037] pb-2 animate-fadeIn">
            <h1 class="text-3xl font-extrabold gold-text font-medieval tracking-widest drop-shadow-md">BABYLON</h1>
            <span class="text-[#d4af37] font-bold bg-[#2b1b17] px-3 py-1 rounded-sm border-2 border-[#5d4037] shadow-md text-sm">라운드 ${roomState.currentRound + 1}/5</span>

          <div class="flex justify-between items-center parchment-panel p-4 rounded-sm shadow-lg border-[4px] border-double border-[#8b6b4a] mb-6 relative animate-fadeIn">
            ${QUEST_SIZES[roomState.players.length].map((size, idx) => {
              const isCurrent = idx === roomState.currentRound;
              const pastResult = roomState.history[idx];
              let circleClass = "w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center font-bold text-lg sm:text-xl transition-all rounded-full ";
              let innerHTML = size;
              
              if (pastResult) {
                circleClass += pastResult.result === 'success' ? 'royal-btn' : 'wax-seal border-2 border-[#ff8a80] text-red-100';
                innerHTML = pastResult.result === 'success' ? '<i data-lucide="shield" class="w-5 h-5"></i>' : '<i data-lucide="sword" class="w-5 h-5"></i>';
              } else if (isCurrent) {
                circleClass += 'gold-btn scale-110 shadow-[0_0_15px_rgba(212,175,55,0.6)] z-10';
              } else {
                circleClass += 'stone-slot text-[#8d6e63]';

              return `

                  ${(roomState.players.length >= 7 && idx === 3) ? '<span class="absolute -bottom-5 text-[9px] text-[#ff5252] font-bold whitespace-nowrap bg-[#140b08] px-1 border border-[#ff5252] rounded-sm">2실패 필요</span>' : ''}

              <span class="text-[#ff5252] font-extrabold text-base">${roomState.rejectCount} / 5</span>
            </div>
            <div class="flex gap-2 h-3">
              ${[1,2,3,4,5].map(i => `<div class="flex-1 rounded-sm border border-[#140b08] shadow-inner ${i <= roomState.rejectCount ? 'bg-[#b71c1c] shadow-[0_0_8px_rgba(239,68,68,0.8)]' : 'bg-[#2b1b17]'}"></div>`).join('')}

          </div>

          <div class="parchment-panel p-5 rounded-sm shadow-[0_15px_35px_rgba(0,0,0,0.9)] border-[6px] border-double border-[#8b6b4a] animate-fadeIn">

                  </button>
                </div>
              </div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'quest') {
        const amIOnTeam = roomState.selectedTeam.includes(myUid);
        const hasSubmitted = roomState.readyPlayers.includes(myUid);
        const isEvil = myPlayer.team === 'evil';
        const submitCount = roomState.readyPlayers.length;

        content += `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-6 rounded-sm shadow-2xl text-center min-h-[500px] flex flex-col justify-center animate-fadeIn">
            <h2 class="text-3xl font-extrabold gold-text mb-3">신앙여정 진행</h2>
            <p class="text-[#bcaaa4] mb-8 font-medium text-sm">여정대원들은 비밀리에 카드를 제출합니다.</p>
            
            ${amIOnTeam ? (
              hasSubmitted ? `
                <div class="flex-1 flex flex-col justify-center items-center">
                  <i data-lucide="check-circle" class="w-16 h-16 text-green-500 mb-4"></i>
                  <h4 class="text-xl font-bold text-[#f5deb3] mb-2">카드 제출 완료</h4>
                  <p class="text-[#bcaaa4] text-sm">여정대원 기다리는 중... (${submitCount}/${roomState.selectedTeam.length})</p>
                </div>
              ` : `
                <div class="flex-1 flex flex-col justify-center">
                  <div class="mb-6">
                    <h4 class="text-xl font-bold text-[#f5deb3] mb-2">카드 제출</h4>
                    ${!isEvil ? `<p class="text-[#64b5f6] text-xs font-bold bg-[#0d47a1]/30 py-1 rounded-sm border border-[#1565c0]">선 진영은 '성공'만 낼 수 있습니다.</p>` : ''}
                  </div>
                  <div class="flex gap-4">
                    <button onclick="submitQuestCard('success')" class="flex-1 py-10 royal-btn rounded-sm font-bold text-2xl flex flex-col items-center gap-3">
                      <i data-lucide="shield" class="w-12 h-12 text-[#82b1ff]"></i> 성공
                    </button>
                    ${isEvil ? `
                      <button onclick="submitQuestCard('fail')" class="flex-1 py-10 blood-btn rounded-sm font-bold text-2xl flex flex-col items-center gap-3">
                        <i data-lucide="sword" class="w-12 h-12 text-[#ff8a80]"></i> 실패
                      </button>
                    ` : ''}
                  </div>
                </div>
              `
            ) : `
              <div class="flex-1 flex flex-col justify-center items-center p-6 stone-slot rounded-sm">
                <i data-lucide="footprints" class="w-12 h-12 text-[#8d6e63] mb-4 animate-pulse"></i>
                <h4 class="text-lg font-bold text-[#f5deb3] mb-2">당신은 이번 여정에 참여하지 않습니다.</h4>
                <p class="text-[#bcaaa4] text-sm">여정대가 임무를 수행 중입니다... (${submitCount}/${roomState.selectedTeam.length})</p>
              </div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'quest_result') {
        const latestResult = roomState.history[roomState.history.length - 1];
        const isFailed = latestResult.result === 'fail';
        const needsTwoFailsStr = (roomState.players.length >= 7 && latestResult.round === 3) ? '(이번 라운드는 2장 필요)' : '';

        content += `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-6 rounded-sm shadow-2xl text-center flex flex-col justify-center min-h-[500px] animate-fadeIn">
            <h2 class="text-3xl font-extrabold mb-3 gold-text">여정 결과</h2>
            <h3 class="text-4xl font-extrabold mb-8 drop-shadow-md ${isFailed ? 'text-[#ff5252]' : 'text-[#64b5f6]'}">${isFailed ? '임무 실패!' : '임무 성공!'}</h3>
            
            <div class="flex justify-center gap-3 mb-8 flex-wrap">
              ${latestResult.cards.map((card, i) => `
                <div class="w-20 h-28 rounded-sm flex items-center justify-center shadow-[0_10px_20px_rgba(0,0,0,0.6)] border-2 animate-fadeIn ${card === 'success' ? 'bg-[linear-gradient(to_bottom,#1565c0,#0d47a1)] border-[#82b1ff] text-[#e3f2fd]' : 'bg-[linear-gradient(to_bottom,#990000,#5c0000)] border-[#ff8a80] text-[#ffebee]'}" style="animation-delay: ${i * 150}ms; animation-fill-mode: both;">
                  <i data-lucide="${card === 'success' ? 'shield' : 'sword'}" class="w-8 h-8"></i>
                </div>
              `).join('')}
            </div>
            
            <div class="stone-slot p-4 mb-8 mx-2 rounded-sm border-[#5d4037]">
              <p class="text-[#f5deb3] font-bold text-lg">제출된 실패 카드: <span class="text-[#ff5252] text-2xl mx-1">${latestResult.fails}</span>장</p>
              ${needsTwoFailsStr ? `<p class="text-xs font-normal text-[#bcaaa4] mt-1">${needsTwoFailsStr}</p>` : ''}
            </div>
            
            ${isHost ? `
              <button onclick="proceedFromResult()" class="w-full py-4 gold-btn font-bold text-xl">다음 단계로 진행</button>
            ` : `
              <div class="p-4 stone-slot text-[#bcaaa4] font-bold text-sm rounded-sm">방장이 결과를 확인 중입니다...</div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'evil_discussion') {
        const amIHerod = myPlayer.roleId === 'herod';
        content += `
          <div class="bg-[linear-gradient(to_bottom_right,#3e1111,#1a0505)] border-[6px] border-double border-[#990000] p-6 rounded-sm shadow-2xl text-center flex flex-col justify-center min-h-[500px] animate-fadeIn">
            <i data-lucide="alert-triangle" class="w-16 h-16 text-[#ff5252] mx-auto mb-4 drop-shadow-[0_0_15px_rgba(255,82,82,0.6)] animate-pulse"></i>
            <h2 class="text-3xl font-extrabold text-[#ff8a80] mb-4">악 진영 모의 시간</h2>
            <p class="text-[#d7ccc8] text-sm mb-8 leading-relaxed font-medium bg-[#140b08]/50 p-4 rounded-sm border border-[#5c0000]">
              헤롯이 모세를 암살하기 전,<br/>악 진영끼리 소리 내어 (또는 눈치껏) 상의하세요.
            </p>
            
            ${amIHerod || isHost ? `
              <button onclick="endEvilDiscussion()" class="w-full py-4 blood-btn font-bold text-xl">모의 종료 (암살 대상 지목으로)</button>
            ` : `
              <div class="p-4 stone-slot text-[#bcaaa4] font-bold text-sm rounded-sm border-[#5c0000]">헤롯이 결정을 내리는 중입니다...</div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'assassination') {
        const amIHerod = myPlayer.roleId === 'herod';
        const herodPlayer = roomState.players.find(p => p.roleId === 'herod');
        
        content += `
          <div class="bg-[linear-gradient(to_bottom_right,#3e1111,#1a0505)] border-[6px] border-double border-[#990000] p-5 rounded-sm shadow-2xl text-center min-h-[500px] flex flex-col justify-center animate-fadeIn">
            <h2 class="text-3xl font-extrabold text-[#ff8a80] mb-2 drop-shadow-[0_2px_4px_rgba(0,0,0,1)]">마지막 위기!</h2>
            <p class="text-[#d7ccc8] text-sm mb-6 font-medium">선 진영이 3번의 여정을 성공했습니다. 하지만 악 진영에게 마지막 기회가 있습니다.</p>
            
            <div class="stone-slot p-4 rounded-sm mb-6 border-[#990000]">
              <h3 class="text-xl font-bold text-[#f5deb3] mb-1">암살자 <span class="text-[#ff5252] font-extrabold drop-shadow-[0_0_8px_rgba(255,82,82,0.5)]">헤롯 (${herodPlayer?.name || '알 수 없음'})</span>의 턴</h3>
              <p class="text-[#bcaaa4] text-xs">모세 역할을 한 자를 정확히 찾아내면 역전승합니다.</p>
            </div>

            ${amIHerod ? `
              <div class="grid grid-cols-2 gap-3 mb-6">
                ${roomState.players.filter(p => p.team === 'good').map(p => `
                  <button onclick="selectTarget('${p.uid}')" class="p-3 rounded-sm text-lg font-bold transition-all ${uiState.localAssassinationTarget === p.uid ? 'blood-btn scale-105 shadow-[0_0_15px_rgba(255,82,82,0.6)]' : 'medieval-btn opacity-90'}">
                    ${p.name}
                  </button>
                `).join('')}
              </div>
              <button onclick="confirmAssassination()" ${!uiState.localAssassinationTarget ? 'disabled' : ''} class="w-full py-4 bg-[linear-gradient(to_bottom,#990000,#5c0000)] hover:bg-[linear-gradient(to_bottom,#b71c1c,#7f0000)] disabled:opacity-50 border-2 border-[#ff5252] text-white rounded-sm font-bold text-xl shadow-[0_10px_20px_rgba(0,0,0,0.8)] transition-all">
                ${uiState.localAssassinationTarget ? `[ ${roomState.players.find(p => p.uid === uiState.localAssassinationTarget).name} ] 암살 확정` : '대상을 선택하세요'}
              </button>
            ` : `
              <div class="flex-1 flex items-center justify-center p-6 stone-slot rounded-sm border-[#5c0000]">
                <p class="text-[#ff8a80] font-bold text-lg animate-pulse">헤롯이 대상을 고르고 있습니다...</p>
              </div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'end') {
        const isGoodWin = roomState.winner === 'good';
        content += `
          <div class="p-6 rounded-sm shadow-[0_20px_50px_rgba(0,0,0,0.9)] border-[8px] border-double text-center animate-slideInDown ${isGoodWin ? 'bg-[linear-gradient(to_bottom_right,#0b2347,#051024)] border-[#1565c0]' : 'bg-[linear-gradient(to_bottom_right,#3e1111,#1a0505)] border-[#b71c1c]'}">
            <i data-lucide="${isGoodWin ? 'shield' : 'sword'}" class="w-16 h-16 ${isGoodWin ? 'text-[#64b5f6] drop-shadow-[0_0_15px_rgba(100,181,246,0.6)]' : 'text-[#ff5252] drop-shadow-[0_0_15px_rgba(255,82,82,0.6)]'} mx-auto mb-4"></i>
            <h1 class="text-4xl font-extrabold mb-4 drop-shadow-[0_4px_6px_rgba(0,0,0,1)] ${isGoodWin ? 'text-[#82b1ff]' : 'text-[#ff8a80]'}">${isGoodWin ? '선 진영 승리!' : '악 진영 승리!'}</h1>
            <p class="text-base text-[#f5deb3] mb-8 font-bold leading-relaxed bg-black/50 p-3 rounded-sm border border-[#4e342e] shadow-inner">${roomState.winReason}</p>
            
            <div class="stone-slot p-5 mb-8 text-left border-[#8b6b4a] rounded-sm">
              <h3 class="text-xl font-bold gold-text mb-4 border-b-2 border-[#5d4037] pb-2 text-center uppercase">모든 역할 공개</h3>
              <div class="space-y-4">
                <div>
                  <h4 class="text-[#64b5f6] font-bold mb-2 text-sm">빛의 자녀들 (선 진영)</h4>
                  <div class="flex flex-wrap gap-2">
                    ${roomState.players.filter(p => p.team === 'good').map(p => `
                      <span class="bg-[#0d47a1]/40 px-3 py-1.5 rounded-sm text-[#e3f2fd] border border-[#1565c0] shadow-sm text-sm">
                        <span class="font-bold">${p.name}</span> <span class="text-[#82b1ff] text-xs ml-1">(${p.characterName} / ${p.role})</span>
                      </span>
                    `).join('')}
                  </div>
                </div>
                <div>
                  <h4 class="text-[#ff8a80] font-bold mb-2 text-sm">어둠의 권세 (악 진영)</h4>
                  <div class="flex flex-wrap gap-2">
                    ${roomState.players.filter(p => p.team === 'evil').map(p => `
                      <span class="bg-[#7f0000]/40 px-3 py-1.5 rounded-sm text-[#ffebee] border border-[#b71c1c] shadow-sm text-sm">
                        <span class="font-bold">${p.name}</span> <span class="text-[#ff8a80] text-xs ml-1">(${p.characterName} / ${p.role})</span>
                      </span>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>
            ${isHost ? `
              <button onclick="resetRoom()" class="w-full py-4 gold-btn font-bold text-xl uppercase tracking-widest">새 게임 다시 시작</button>
            ` : `
              <div class="p-4 stone-slot text-[#bcaaa4] font-bold text-sm rounded-sm">방장이 게임을 다시 시작할 수 있습니다.</div>
            `}
          </div>
        `;
      }

      return content;
    };

    // --- 메인 렌더 함수 ---
    const render = () => {
      const app = document.getElementById('app');
      
      if (appState === 'initializing') {
        // Init state handled by loading spinner in HTML
        return;
      }
      
      let html = '';
      if (appState === 'lobby') {
        html = renderLobby();
      } else if (appState === 'ingame') {
        html = renderGame();
      }

      app.innerHTML = html;
      lucide.createIcons();
    };

  </script>
</body>
</html>
