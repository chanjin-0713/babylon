<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BABYLON - 신앙의 여정</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #1e1512; }
    .font-medieval { font-family: 'Cinzel', 'Noto Serif KR', serif; }
    
    .wood-bg { background: linear-gradient(135deg, #1e1512 0%, #0d0705 100%); }
    .parchment-panel { background: linear-gradient(to bottom right, #2f221a, #1f140e); }
    
    .gold-text { background: linear-gradient(to bottom, #fada5e, #d4af37, #996515); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .wax-seal { background: radial-gradient(circle at 30% 30%, #b71c1c, #7f0000); box-shadow: inset 0 0 10px rgba(0,0,0,0.7), 0 4px 6px rgba(0,0,0,0.8); }
    .stone-slot { background: #140b08; box-shadow: inset 0 4px 8px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.05); border: 2px solid #3e2723; }
    
    .medieval-btn { background: linear-gradient(to bottom, #4e342e, #2b1b17); border: 2px solid #795548; box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.05); color: #e6d5c3; transition: all 0.2s; }
    .medieval-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #5d4037, #3e2723); border-color: #8d6e63; }
    .medieval-btn:active:not(:disabled) { background: #2b1b17; box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); transform: translateY(2px); }
    .medieval-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .gold-btn { background: linear-gradient(to bottom, #d4af37, #aa8000); border: 2px solid #ffe066; color: #1a110c; text-shadow: 0 1px 1px rgba(255,255,255,0.3); box-shadow: 0 4px 8px rgba(0,0,0,0.7); transition: all 0.2s; }
    .gold-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #e5c158, #b8860b); }
    .gold-btn:active:not(:disabled) { background: #996515; transform: translateY(2px); box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); }
    .gold-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(50%); }
    
    .blood-btn { background: linear-gradient(to bottom, #990000, #5c0000); border: 2px solid #ff5252; color: #ffebee; box-shadow: 0 4px 8px rgba(0,0,0,0.7); transition: all 0.2s; }
    .blood-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #b71c1c, #7f0000); }
    .blood-btn:active:not(:disabled) { background: #5c0000; transform: translateY(2px); box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); transform: translateY(2px); }
    .blood-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .royal-btn { background: linear-gradient(to bottom, #1565c0, #0d47a1); border: 2px solid #82b1ff; color: #e3f2fd; box-shadow: 0 4px 8px rgba(0,0,0,0.7); transition: all 0.2s; }
    .royal-btn:hover:not(:disabled) { background: linear-gradient(to bottom, #1976d2, #1565c0); }
    .royal-btn:active:not(:disabled) { background: #0a3a82; transform: translateY(2px); box-shadow: inset 0 4px 6px rgba(0,0,0,0.8); }
    .royal-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .medieval-input { background: rgba(0,0,0,0.6); border: 2px solid #4e342e; color: #f5deb3; text-transform: uppercase; }
    .medieval-input:focus { border-color: #d4af37; outline: none; box-shadow: 0 0 10px rgba(212,175,55,0.3); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-in-out; }
    @keyframes slideInDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-slideInDown { animation: slideInDown 0.3s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen wood-bg text-[#e6d5c3] font-medieval overflow-x-hidden flex justify-center">

  <div id="app" class="w-full max-w-md relative pt-12 p-4 sm:p-6 pb-20">
    <div class="flex items-center justify-center h-64">
      <i data-lucide="loader-2" class="w-12 h-12 text-[#d4af37] animate-spin"></i>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase Initialization ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDOVJQHcvvk3kN3hVy-krXNRvBdvmNkrxM",
      authDomain: "babylon-15548.firebaseapp.com",
      projectId: "babylon-15548",
      storageBucket: "babylon-15548.firebasestorage.app",
      messagingSenderId: "177872947585",
      appId: "1:177872947585:web:5a33b674f5b9a1a2e6c080"
    };
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- STREAMING_CHUNK: Defining Game Constants and Roles ---
    // 최소 플레이어 인원을 1명으로 조정
    const MIN_PLAYERS = 1;
    const MAX_PLAYERS = 10;

    const GOOD_ROLES_ORDER = [
      { roleId: 'moses', characterName: '모세', role: '멀린', desc: '느부갓네살을 제외한 악 진영이 누구인지 알고 있습니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Moses%20parting%20the%20sea?width=400&height=400&nologo=true&seed=1' },
      { roleId: 'daniel', characterName: '다니엘', role: '퍼시벌', desc: '모세와 이세벨의 정체를 알지만, 누가 진짜 모세인지는 모릅니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Daniel%20in%20lion%20den?width=400&height=400&nologo=true&seed=2' },
      { roleId: 'esther', characterName: '에스더', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Queen%20Esther%20beautiful?width=400&height=400&nologo=true&seed=3' },
      { roleId: 'jacob', characterName: '야곱', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Jacob%20wrestling%20angel?width=400&height=400&nologo=true&seed=4' },
      { roleId: 'noah', characterName: '노아', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20Noah%20and%20ark?width=400&height=400&nologo=true&seed=5' },
      { roleId: 'abraham', characterName: '아브라함', role: '충신', desc: '특별한 능력은 없지만, 선 진영을 위해 헌신합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20biblical%20patriarch%20Abraham%20looking%20at%20stars?width=400&height=400&nologo=true&seed=6' }
    ];

    const EVIL_ROLES_ORDER = [
      { roleId: 'herod', characterName: '헤롯', role: '암살자', desc: '악 진영의 정체를 압니다. 게임 패배 시 모세를 암살하면 역전승합니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20evil%20King%20Herod%20angry?width=400&height=400&nologo=true&seed=7' },
      { roleId: 'jezebel', characterName: '이세벨', role: '모르가나', desc: '악 진영의 정체를 압니다. 다니엘에게 모세처럼 보입니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20wicked%20Queen%20Jezebel?width=400&height=400&nologo=true&seed=8' },
      { roleId: 'nebuchadnezzar', characterName: '느부갓네살', role: '모드레드', desc: '악 진영의 정체를 압니다. 모세에게 자신의 정체를 숨깁니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20King%20Nebuchadnezzar%20babylon?width=400&height=400&nologo=true&seed=9' },
      { roleId: 'pharaoh', characterName: '바로', role: '오베론', desc: '악 진영의 정체를 모두 압니다.', img: 'https://image.pollinations.ai/prompt/classical%20oil%20painting%20of%20Egyptian%20Pharaoh%20exodus?width=400&height=400&nologo=true&seed=10' }
    ];

    // 1~10인용 역할 배분 (선, 악 비율 설정)
    const ROLE_COUNTS = {
      1: [1, 0], // 1인: 선 1명, 악 0명
      2: [1, 1], // 2인: 선 1명, 악 1명
      3: [2, 1], // 3인: 선 2명, 악 1명
      4: [3, 1], // 4인: 선 3명, 악 1명
      5: [3, 2], 
      6: [4, 2], 
      7: [4, 3], 
      8: [5, 3], 
      9: [6, 3], 
      10: [6, 4]
    };

    // 1~10인용 성전 여정 필요 대원수 설정
    const QUEST_SIZES = {
      1: [1, 1, 1, 1, 1],
      2: [1, 1, 1, 1, 1],
      3: [2, 1, 2, 1, 2],
      4: [2, 2, 2, 2, 2],
      5: [2, 3, 2, 3, 3], 
      6: [2, 3, 4, 3, 4], 
      7: [2, 3, 3, 4, 4],
      8: [3, 4, 4, 5, 5], 
      9: [3, 4, 4, 5, 5], 
      10: [3, 4, 4, 5, 5]
    };

    const shuffle = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // --- STREAMING_CHUNK: Initializing State Variables ---
    let myUid = null;
    let localPlayerName = '';
    let roomCode = null;
    let isHost = false;
    let unsubscribeRoom = null;
    
    // 로컬 전용 UI 상태
    let appState = 'initializing'; // initializing, lobby, ingame
    let errorMsg = '';
    let uiState = {
      isSecretVisible: false,
      localAssassinationTarget: null
    };

    // Firestore 동기화 상태
    let roomState = {
      gameState: 'setup',
      players: [],
      leaderIndex: 0,
      currentRound: 0,
      rejectCount: 0,
      selectedTeam: [],
      votes: {},
      questCards: [],
      history: [],
      readyPlayers: [],
      winner: null,
      winReason: ''
    };

    // --- STREAMING_CHUNK: Authentication Handling ---
    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) {
        showError("인증에 실패했습니다.");
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        myUid = user.uid;
        if (appState === 'initializing') {
          appState = 'lobby';
          render();
        }
      }
    });

    initAuth();

    // --- STREAMING_CHUNK: Room Sync and Database Helpers ---
    window.showError = (msg) => {
      errorMsg = msg;
      render();
      setTimeout(() => { errorMsg = ''; render(); }, 3000);
    };

    const updateRoom = async (updates) => {
      if (!myUid || !roomCode) return;
      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
      try {
        await updateDoc(roomRef, updates);
      } catch (e) {
        console.error("Update failed", e);
      }
    };

    const subscribeToRoom = () => {
      if (unsubscribeRoom) unsubscribeRoom();
      const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
      
      unsubscribeRoom = onSnapshot(roomRef, (snapshot) => {
        if (snapshot.exists()) {
          roomState = snapshot.data();
          handleHostAutoTransitions();
          render();
        } else {
          showError("방이 삭제되었거나 존재하지 않습니다.");
          window.leaveRoomLocal();
        }
      }, (error) => {
        showError("연결 오류가 발생했습니다.");
      });
    };

    // --- STREAMING_CHUNK: Host Automations & Transitions ---
    const handleHostAutoTransitions = () => {
      if (!isHost) return;

      // 역할 확인 완료 처리
      if (roomState.gameState === 'reveal' && roomState.readyPlayers.length >= roomState.players.length) {
        updateRoom({ gameState: 'pre_discussion', readyPlayers: [] });
      }
      
      // 투표 완료 처리
      if (roomState.gameState === 'voting' && Object.keys(roomState.votes || {}).length >= roomState.players.length) {
        const approveCount = Object.values(roomState.votes).filter(v => v === 'approve').length;
        if (approveCount > roomState.players.length / 2) {
          updateRoom({ gameState: 'quest', questCards: [], readyPlayers: [] });
        } else {
          const newRejectCount = roomState.rejectCount + 1;
          if (newRejectCount >= 5) {
            updateRoom({ gameState: 'end', winner: 'evil', winReason: '5연속 신앙여정대 파견 부결로 인한 악 진영 승리!' });
          } else {
            updateRoom({
              gameState: 'pre_discussion',
              rejectCount: newRejectCount,
              leaderIndex: (roomState.leaderIndex + 1) % roomState.players.length,
              selectedTeam: [],
              votes: {},
              readyPlayers: []
            });
          }
        }
      }

      // 여정 카드 제출 완료 처리
      if (roomState.gameState === 'quest' && roomState.questCards.length >= roomState.selectedTeam.length) {
        // 이미 처리되었는지 방지
        if (roomState.readyPlayers.length === 0) return; 

        const failCount = roomState.questCards.filter(c => c === 'fail').length;
        const needsTwoFails = roomState.players.length >= 7 && roomState.currentRound === 3;
        const resultStatus = (needsTwoFails ? failCount >= 2 : failCount >= 1) ? 'fail' : 'success';

        const newHistory = [...(roomState.history || []), {
          round: roomState.currentRound,
          team: [...roomState.selectedTeam],
          votes: { ...roomState.votes },
          cards: shuffle([...roomState.questCards]),
          result: resultStatus,
          fails: failCount
        }];

        updateRoom({ 
          gameState: 'quest_result', 
          history: newHistory,
          readyPlayers: [] // 락 해제
        });
      }
    };


    // --- STREAMING_CHUNK: Action Handlers (Button events) ---
    window.setLocalName = (e) => { localPlayerName = e.target.value.trim(); };
    window.setJoinCode = (e) => { e.target.value = e.target.value.toUpperCase(); };

    window.createRoom = async () => {
      if (!myUid) return;
      if (!localPlayerName) return showError("이름을 입력해주세요.");
      
      const code = Math.random().toString(36).substring(2, 6).toUpperCase();
      const initialData = {
        gameState: 'setup',
        players: [{ uid: myUid, name: localPlayerName, isHost: true }],
        leaderIndex: 0, currentRound: 0, rejectCount: 0,
        selectedTeam: [], votes: {}, questCards: [], history: [], readyPlayers: []
      };

      try {
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
        await setDoc(roomRef, initialData);
        roomCode = code;
        isHost = true;
        appState = 'ingame';
        subscribeToRoom();
      } catch (e) {
        showError("방 생성에 실패했습니다.");
      }
    };

    window.joinRoomAction = async () => {
      if (!myUid) return;
      const codeInput = document.getElementById('joinCodeInput');
      const code = codeInput ? codeInput.value.trim() : '';
      
      if (!localPlayerName) return showError("이름을 입력해주세요.");
      if (!code || code.length !== 4) return showError("올바른 4자리 코드를 입력해주세요.");

      try {
        const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code);
        const docSnap = await getDoc(roomRef);
        
        if (!docSnap.exists()) {
          return showError("존재하지 않는 방입니다.");
        }
        
        const data = docSnap.data();
        if (data.gameState !== 'setup') {
          return showError("이미 시작된 게임입니다.");
        }
        if (data.players.length >= MAX_PLAYERS) {
          return showError("방이 가득 찼습니다.");
        }
        if (data.players.some(p => p.name === localPlayerName)) {
          return showError("이미 사용 중인 이름입니다.");
        }

        await updateDoc(roomRef, {
          players: arrayUnion({ uid: myUid, name: localPlayerName, isHost: false })
        });

        roomCode = code;
        isHost = false;
        appState = 'ingame';
        subscribeToRoom();
      } catch (e) {
        showError("방 참여에 실패했습니다.");
      }
    };

    window.leaveRoomLocal = () => {
      if (unsubscribeRoom) unsubscribeRoom();
      roomCode = null;
      isHost = false;
      appState = 'lobby';
      uiState = { isSecretVisible: false, localAssassinationTarget: null };
      render();
    };

    window.startGame = async () => {
      if (!isHost || roomState.players.length < MIN_PLAYERS) return;
      
      const pCount = roomState.players.length;
      const [goodCount, evilCount] = ROLE_COUNTS[pCount];
      
      const goodRoles = GOOD_ROLES_ORDER.slice(0, goodCount).map(r => ({ ...r, team: 'good' }));
      const evilRoles = EVIL_ROLES_ORDER.slice(0, evilCount).map(r => ({ ...r, team: 'evil' }));
      
      const allRoles = shuffle([...goodRoles, ...evilRoles]);
      
      const assignedPlayers = shuffle(roomState.players).map((p, i) => ({
        ...p, id: p.uid, ...allRoles[i]
      }));

      await updateRoom({
        gameState: 'reveal',
        players: assignedPlayers,
        leaderIndex: Math.floor(Math.random() * pCount),
        readyPlayers: []
      });
    };

    window.revealSecret = () => {
      uiState.isSecretVisible = true;
      render();
    };

    window.confirmReady = async () => {
      if (!myUid || roomState.readyPlayers.includes(myUid)) return;
      await updateRoom({ readyPlayers: arrayUnion(myUid) });
    };

    window.endPreDiscussion = async () => {
      const isLeader = roomState.players[roomState.leaderIndex]?.uid === myUid;
      if (!isLeader) return;
      await updateRoom({ gameState: 'board' });
    };

    window.toggleSelection = async (targetUid) => {
      const isLeader = roomState.players[roomState.leaderIndex]?.uid === myUid;
      if (!isLeader || roomState.gameState !== 'board') return;
      
      const reqPlayers = QUEST_SIZES[roomState.players.length][roomState.currentRound];
      let newSelection = [...roomState.selectedTeam];
      
      const idx = newSelection.indexOf(targetUid);
      if (idx > -1) {
        newSelection.splice(idx, 1);
      } else if (newSelection.length < reqPlayers) {
        newSelection.push(targetUid);
      }
      
      await updateRoom({ selectedTeam: newSelection });
    };

    window.confirmTeam = async () => {
      const isLeader = roomState.players[roomState.leaderIndex]?.uid === myUid;
      if (!isLeader) return;
      
      const reqPlayers = QUEST_SIZES[roomState.players.length][roomState.currentRound];
      if (roomState.selectedTeam.length !== reqPlayers) return;

      // discussion 상태를 거치지 않고 바로 투표로 안전하게 진입
      await updateRoom({ gameState: 'voting', votes: {}, readyPlayers: [] });
    };

    window.submitVote = async (voteType) => {
      if (!myUid || roomState.votes[myUid]) return;
      const updates = {};
      updates[`votes.${myUid}`] = voteType;
      await updateRoom(updates);
    };

    window.submitQuestCard = async (cardType) => {
      if (!myUid || roomState.readyPlayers.includes(myUid)) return;
      if (!roomState.selectedTeam.includes(myUid)) return;

      // 선 진영은 무조건 'success'만 가능
      const myPlayer = roomState.players.find(p => p.uid === myUid);
      if (myPlayer?.team === 'good' && cardType === 'fail') return;

      await updateRoom({
        questCards: arrayUnion(cardType),
        readyPlayers: arrayUnion(myUid)
      });
    };

    window.proceedFromResult = async () => {
      if (!isHost) return;
      const goodWins = roomState.history.filter(h => h.result === 'success').length;
      const evilWins = roomState.history.filter(h => h.result === 'fail').length;

      // 소수 인원 테스트 등에서 악 진영이 아예 없는 상황 체크
      const hasEvil = roomState.players.some(p => p.team === 'evil');

      if (goodWins >= 3) {
        if (hasEvil) {
          await updateRoom({ gameState: 'evil_discussion' });
        } else {
          await updateRoom({ gameState: 'end', winner: 'good', winReason: '신앙여정 3회 대성공으로 선 진영의 성전 완수!' });
        }
      } else if (evilWins >= 3) {
        await updateRoom({ gameState: 'end', winner: 'evil', winReason: '신앙여정 3회 실패로 악 진영 승리!' });
      } else {
        await updateRoom({
          gameState: 'pre_discussion',
          currentRound: roomState.currentRound + 1,
          rejectCount: 0,
          leaderIndex: (roomState.leaderIndex + 1) % roomState.players.length,
          selectedTeam: [],
          readyPlayers: [],
          questCards: [],
          votes: {}
        });
      }
    };

    window.endEvilDiscussion = async () => {
      const myPlayer = roomState.players.find(p => p.uid === myUid);
      if (!myPlayer || (myPlayer.roleId !== 'herod' && !isHost)) return;
      await updateRoom({ gameState: 'assassination' });
    };

    window.selectTarget = (uid) => {
      const myPlayer = roomState.players.find(p => p.uid === myUid);
      if (!myPlayer || myPlayer.roleId !== 'herod') return;
      uiState.localAssassinationTarget = uid;
      render();
    };

    window.confirmAssassination = async () => {
      const myPlayer = roomState.players.find(p => p.uid === myUid);
      if (!myPlayer || myPlayer.roleId !== 'herod' || !uiState.localAssassinationTarget) return;
      
      const targetPlayer = roomState.players.find(p => p.uid === uiState.localAssassinationTarget);
      if (targetPlayer.roleId === 'moses') {
        await updateRoom({ gameState: 'end', winner: 'evil', winReason: `헤롯이 모세(${targetPlayer.name})를 찾아내 암살했습니다. 악 진영 역전승!` });
      } else {
        await updateRoom({ gameState: 'end', winner: 'good', winReason: `헤롯이 모세 암살에 실패했습니다. (지목: ${targetPlayer.name}) 선 진영 승리!` });
      }
    };

    window.resetRoom = async () => {
      if (!isHost) return;
      await updateRoom({
        gameState: 'setup',
        currentRound: 0,
        rejectCount: 0,
        history: [],
        winner: null,
        winReason: '',
        leaderIndex: 0,
        selectedTeam: [],
        votes: {},
        questCards: [],
        readyPlayers: [],
        players: roomState.players.map(p => ({ uid: p.uid, name: p.name, isHost: p.isHost })) // 역할 초기화
      });
      uiState = { isSecretVisible: false, localAssassinationTarget: null };
    };

    // --- STREAMING_CHUNK: Knowledge Handlers ---
    const getKnowledge = (player) => {
      if (player.roleId === 'moses') {
        const knownEvils = roomState.players.filter(p => p.team === 'evil' && p.roleId !== 'nebuchadnezzar').map(p => p.name);
        return knownEvils.length > 0 ? `악 진영 (느부갓네살 제외): ${knownEvils.join(', ')}` : '알려진 악 진영이 없습니다.';
      }
      if (player.roleId === 'daniel') {
        let targets = roomState.players.filter(p => p.roleId === 'moses' || p.roleId === 'jezebel').map(p => p.name);
        return `모세 혹은 이세벨: ${shuffle(targets).join(', ')}`;
      }
      if (player.team === 'evil') {
        const evils = roomState.players.filter(p => p.team === 'evil' && p.uid !== player.uid).map(p => `${p.name} (${p.characterName})`);
        return evils.length > 0 ? `악 진영 동료: ${evils.join(', ')}` : '당신 외에 악 진영 동료가 없습니다.';
      }
      return '특별히 알고 있는 정보가 없습니다.';
    };

    // --- STREAMING_CHUNK: Core HTML Generation and UI ---
    const getErrorHTML = () => errorMsg ? `
      <div class="fixed top-4 left-0 right-0 z-[100] flex justify-center animate-slideInDown pointer-events-none">

    const getBoardHTML = () => {
      const pCount = roomState.players.length;
      if (!QUEST_SIZES[pCount]) return '';
      const reqPlayersArr = QUEST_SIZES[pCount];
      
      const roundTrack = reqPlayersArr.map((req, idx) => {
        const hist = roomState.history[idx];
        let statusClass = "bg-[#140b08] border-[#3e2723] text-[#8d6e63]"; 
        let iconHTML = `<span class="text-lg">${req}</span>`;
        if (hist) {

            iconHTML = `<i data-lucide="shield-check" class="w-6 h-6"></i>`;
          } else {
            statusClass = "bg-[#b71c1c] border-[#ff5252] text-white shadow-[0_0_10px_#b71c1c]";
            iconHTML = `<i data-lucide="skull" class="w-5 h-5"></i>`;
          }

          statusClass = "bg-[#d4af37] border-[#ffe066] text-[#1a110c] shadow-[0_0_15px_#d4af37] animate-pulse";
        }
        return `<div class="w-12 h-12 rounded-full border-2 flex items-center justify-center font-bold ${statusClass}">${iconHTML}</div>`;
      }).join('');

      const rejectTrack = Array(5).fill(0).map((_, i) =>

      return `

          <div class="flex justify-between items-center mb-4">

          <div class="flex justify-between items-center px-2">
            <span class="text-xs text-[#8d6e63] font-bold uppercase">부결 횟수</span>
            <div class="flex gap-2">${rejectTrack}</div>
          </div>
        </div>
      `;
    };


    // --- STREAMING_CHUNK: Component Render Logic ---
    const renderLobby = () => {

                    <img src="${myPlayer.img || 'https://placehold.co/400x400/2f221a/e6d5c3?text=' + myPlayer.characterName}" class="w-full h-full object-cover">

                  <h5 class="text-2xl font-bold mb-3 drop-shadow-md ${isGood ? 'text-[#64b5f6]' : 'text-[#ff5252]'}">${myPlayer.characterName} <span class="opacity-80 text-lg">(${myPlayer.role})</span></h5>
                  
                  <p class="text-[#d7ccc8] text-sm mb-4 leading-relaxed stone-slot px-4 py-3 rounded-sm font-medium w-full">"${myPlayer.desc}"</p>
                  
                  <div class="w-full bg-[#140b08]/80 p-4 rounded-sm border border-[#5d4037] text-left mb-6 shadow-inner">
                    <span class="block text-sm gold-text mb-2 font-bold uppercase">알려진 진실:</span>
                    <span class="text-[#f5deb3] font-medium leading-relaxed">${getKnowledge(myPlayer)}</span>
                  </div>
                  
                  ${isReady ? `
                    <div class="w-full py-4 bg-[#2b1b17] border-2 border-[#4e342e] text-[#bcaaa4] font-bold rounded-sm flex justify-center items-center gap-2">
                      <i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i> 확인 완료. 다른 플레이어 대기 중 (${roomState.readyPlayers.length}/${roomState.players.length})
                    </div>
                  ` : `
                    <button onclick="confirmReady()" class="w-full py-4 gold-btn font-bold text-xl flex items-center justify-center gap-3">
                      확인 완료
                    </button>
                  `}
                </div>
              `}
            </div>
          </div>
        `;
      }
      else if (roomState.gameState === 'pre_discussion') {
        const reqPlayers = QUEST_SIZES[roomState.players.length][roomState.currentRound];
        content += getBoardHTML() + `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-8 rounded-sm shadow-2xl text-center flex flex-col justify-center min-h-[400px] animate-fadeIn">
            <i data-lucide="message-circle" class="w-12 h-12 text-[#d4af37] mx-auto mb-4 drop-shadow-lg"></i>
            <h2 class="text-2xl font-extrabold gold-text mb-2">여정대 지목 전 토론</h2>
            
            <div class="my-6">
              <h3 class="text-lg text-[#bcaaa4] mb-2 font-bold">이번 신앙여정 대장</h3>
              <div class="flex items-center justify-center gap-2 mb-4">
                <i data-lucide="crown" class="w-8 h-8 text-[#d4af37]"></i>
                <span class="text-3xl font-bold text-[#f5deb3]">${currentLeader.name}</span>
              </div>
              <p class="text-[#8d6e63] mt-2 mb-8 text-sm max-w-[250px] mx-auto leading-relaxed font-bold">
                대장이 <strong class="text-[#d4af37] text-lg">${reqPlayers}명</strong>의 여정대를 고민하고 있습니다.<br>

            ${isLeader ? `
              <button onclick="endPreDiscussion()" class="w-full py-4 gold-btn text-xl font-bold rounded-sm shadow-lg">여정대 편성하기</button>
            ` : `
              <div class="stone-slot p-4 text-[#d7ccc8] font-bold rounded-sm"><i data-lucide="hourglass" class="inline w-5 h-5 animate-pulse mb-1"></i> 대장의 결정을 기다리는 중...</div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'board') {
        const reqPlayers = QUEST_SIZES[roomState.players.length][roomState.currentRound];
        const isReadyToConfirm = roomState.selectedTeam.length === reqPlayers;
        
        content += getBoardHTML() + `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-4 rounded-sm shadow-2xl animate-fadeIn">
            <h2 class="text-xl font-extrabold gold-text mb-4 text-center">여정대 편성 (${roomState.selectedTeam.length}/${reqPlayers})</h2>
            
            <div class="grid grid-cols-2 gap-2 mb-6">
              ${roomState.players.map(p => {
                const isSelected = roomState.selectedTeam.includes(p.uid);
                const isL = p.uid === currentLeader.uid;
                return `
                  <div onclick="toggleSelection('${p.uid}')" 
                       class="relative p-3 rounded-sm border-2 cursor-pointer transition-all flex flex-col items-center justify-center
                       ${isSelected ? 'bg-[#3e2723] border-[#d4af37] shadow-[inset_0_0_15px_rgba(212,175,55,0.3)]' : 'bg-[#140b08] border-[#4e342e] hover:border-[#8d6e63]'}
                       ${!isLeader ? 'pointer-events-none' : ''}">
                    ${isL ? '<i data-lucide="crown" class="absolute top-1 left-1 w-4 h-4 text-[#d4af37]"></i>' : ''}
                    ${isSelected ? '<i data-lucide="check-circle-2" class="absolute top-1 right-1 w-4 h-4 text-green-500"></i>' : ''}
                    <span class="font-bold text-[#f5deb3]">${p.name}</span>

                <i data-lucide="loader-2" class="inline w-5 h-5 animate-spin mb-1"></i> 대장이 팀을 편성 중입니다...

        const myVote = roomState.votes[myUid];
        
        content += getBoardHTML() + `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-6 rounded-sm shadow-2xl text-center animate-fadeIn">

                  <button onclick="submitQuestCard('success')" class="w-full py-6 royal-btn rounded-sm font-bold text-2xl flex items-center justify-center gap-3">
                    <i data-lucide="shield-check" class="w-8 h-8"></i> 성공 (Success)
                  </button>
                  <button onclick="submitQuestCard('fail')" ${isGood ? 'disabled title="선 진영은 실패를 낼 수 없습니다."' : ''} class="w-full py-6 blood-btn rounded-sm font-bold text-2xl flex items-center justify-center gap-3">
                    <i data-lucide="skull" class="w-8 h-8"></i> 실패 (Fail)
                  </button>
                  ${isGood ? '<p class="text-xs text-[#ff5252] font-bold mt-1">※ 선 진영은 반드시 성공만 선택할 수 있습니다.</p>' : ''}
                </div>
              `}
            ` : `
              <div class="p-8 stone-slot rounded-sm flex flex-col items-center justify-center min-h-[250px]">
                <i data-lucide="sword" class="w-12 h-12 text-[#8d6e63] mb-4 animate-bounce"></i>
                <p class="text-[#d7ccc8] font-bold text-lg">여정대가 임무를 수행 중입니다...</p>
                <p class="text-xs text-[#8d6e63] mt-2">(${roomState.readyPlayers.length}/${roomState.selectedTeam.length} 명 완료)</p>
              </div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'quest_result') {
        const currentHist = roomState.history[roomState.history.length - 1];
        const isSuccess = currentHist.result === 'success';

        content += getBoardHTML() + `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-6 rounded-sm shadow-2xl text-center animate-fadeIn">
            <h2 class="text-2xl font-extrabold mb-6 ${isSuccess ? 'text-[#82b1ff]' : 'text-[#ff5252]'}">
              여정 ${isSuccess ? '성공!' : '실패...'}
            </h2>
            
            <div class="flex justify-center gap-2 mb-8">
              ${currentHist.cards.map(card => `
                <div class="w-16 h-24 border-2 rounded-sm flex items-center justify-center shadow-lg
                  ${card === 'success' ? 'bg-[#1565c0] border-[#82b1ff] text-white' : 'bg-[#b71c1c] border-[#ff5252] text-white'}">
                  <i data-lucide="${card === 'success' ? 'shield-check' : 'skull'}" class="w-8 h-8"></i>
                </div>
              `).join('')}
            </div>

            <p class="text-[#bcaaa4] font-bold mb-6">총 ${currentHist.fails}개의 실패가 나왔습니다.</p>

            ${isHost ? `
              <button onclick="proceedFromResult()" class="w-full py-4 gold-btn text-xl font-bold rounded-sm">다음으로</button>
            ` : `
              <div class="stone-slot p-4 text-[#d7ccc8] font-bold rounded-sm">
                방장이 다음 단계를 준비 중입니다...
              </div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'evil_discussion') {
        const isHerod = myPlayer?.roleId === 'herod';

        content += getBoardHTML() + `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-6 rounded-sm shadow-2xl text-center animate-fadeIn min-h-[400px] flex flex-col justify-center">
            <i data-lucide="eye" class="w-16 h-16 text-[#ff5252] mx-auto mb-4 drop-shadow-lg animate-pulse"></i>
            <h2 class="text-2xl font-extrabold text-[#ff5252] mb-4">선 진영 3회 성공!</h2>
            <p class="text-[#d7ccc8] font-bold mb-6 leading-relaxed">
              빛의 자녀들이 승리하기 직전입니다.<br>
              하지만 어둠의 세력에게 마지막 기회가 있습니다.<br>
              <strong class="text-white text-lg">악 진영은 '모세'가 누구인지 논의하십시오.</strong>
            </p>
            
            ${isHerod || isHost ? `
              <button onclick="endEvilDiscussion()" class="w-full py-4 blood-btn text-xl font-bold rounded-sm">암살 대상 선택하기 (헤롯)</button>
            ` : `
              <div class="stone-slot p-4 text-[#d7ccc8] font-bold rounded-sm">
                헤롯이 암살 대상을 고민 중입니다...
              </div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'assassination') {
        const isHerod = myPlayer?.roleId === 'herod';
        const targets = roomState.players.filter(p => p.uid !== myUid);

        content += getBoardHTML() + `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-6 rounded-sm shadow-2xl animate-fadeIn">
            <h2 class="text-2xl font-extrabold text-[#ff5252] mb-2 text-center">모세 암살</h2>
            <p class="text-[#bcaaa4] font-bold mb-6 text-center text-sm">헤롯은 모세라고 생각되는 자를 지목하십시오.</p>
            
            <div class="grid grid-cols-2 gap-2 mb-6">
              ${targets.map(p => {
                const isSelected = uiState.localAssassinationTarget === p.uid;
                return `
                  <div onclick="selectTarget('${p.uid}')" 
                       class="relative p-3 rounded-sm border-2 cursor-pointer transition-all flex flex-col items-center justify-center
                       ${isSelected ? 'bg-[#7f0000] border-[#ff5252] shadow-[inset_0_0_15px_rgba(255,82,82,0.4)]' : 'bg-[#140b08] border-[#4e342e] hover:border-[#ff5252]'}
                       ${!isHerod ? 'pointer-events-none' : ''}">
                    ${isSelected ? '<i data-lucide="crosshair" class="absolute top-1 right-1 w-4 h-4 text-[#ff5252]"></i>' : ''}
                    <span class="font-bold text-[#f5deb3]">${p.name}</span>
                  </div>
                `;
              }).join('')}
            </div>

            ${isHerod ? `
              <button onclick="confirmAssassination()" ${!uiState.localAssassinationTarget ? 'disabled' : ''} class="w-full py-4 blood-btn text-xl font-bold rounded-sm">
                암살 실행
              </button>
            ` : `
              <div class="stone-slot p-4 text-[#d7ccc8] font-bold rounded-sm text-center">
                헤롯이 단검을 쥐고 다가가고 있습니다...
              </div>
            `}
          </div>
        `;
      }
      else if (roomState.gameState === 'end') {
        const isGoodWin = roomState.winner === 'good';
        
        content += `
          <div class="parchment-panel border-[6px] border-double border-[#8b6b4a] p-6 rounded-sm shadow-2xl text-center animate-fadeIn relative overflow-hidden">
            <div class="absolute inset-0 bg-${isGoodWin ? '[#0d47a1]' : '[#7f0000]'} opacity-20 pointer-events-none"></div>
            
            <i data-lucide="${isGoodWin ? 'crown' : 'skull'}" class="w-20 h-20 mx-auto mb-2 ${isGoodWin ? 'text-[#d4af37]' : 'text-[#ff5252]'} relative z-10"></i>
            <h1 class="text-4xl font-extrabold mb-2 uppercase ${isGoodWin ? 'gold-text' : 'text-[#ff5252]'} relative z-10">${isGoodWin ? '선 진영 승리' : '악 진영 승리'}</h1>
            <p class="text-[#d7ccc8] font-bold mb-8 relative z-10">${roomState.winReason}</p>
            
            <div class="space-y-2 mb-8 text-left relative z-10">
              <h3 class="text-xl gold-text font-bold mb-4 text-center border-b border-[#5d4037] pb-2">모든 역할 공개</h3>
              ${roomState.players.map(p => `
                <div class="flex items-center justify-between bg-[#140b08]/80 border ${p.team === 'good' ? 'border-[#1565c0]' : 'border-[#b71c1c]'} px-4 py-2 rounded-sm">
                  <span class="font-bold text-[#f5deb3]">${p.name}</span>
                  <span class="text-sm font-bold ${p.team === 'good' ? 'text-[#82b1ff]' : 'text-[#ff5252]'}">${p.characterName} (${p.role})</span>
                </div>
              `).join('')}
            </div>

            ${isHost ? `
              <button onclick="resetRoom()" class="w-full py-4 gold-btn text-xl font-bold rounded-sm relative z-10 flex items-center justify-center gap-2">
                <i data-lucide="rotate-ccw" class="w-6 h-6"></i> 새로운 게임 시작
              </button>
            ` : `
              <div class="stone-slot p-4 text-[#d7ccc8] font-bold rounded-sm text-center relative z-10">
                방장이 새 게임을 준비할 수 있습니다.
              </div>
            `}
          </div>
        `;
      }

      return content;
    };

    const render = () => {
      const appDiv = document.getElementById('app');
      if (!appDiv) return;

      if (appState === 'initializing') {
        appDiv.innerHTML = `<div class="flex items-center justify-center h-64"><i data-lucide="loader-2" class="w-12 h-12 text-[#d4af37] animate-spin"></i></div>`;
      } else if (appState === 'lobby') {
        appDiv.innerHTML = renderLobby();
      } else if (appState === 'ingame') {
        appDiv.innerHTML = renderGame();
      }

      setTimeout(() => {
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }, 0);
    };

    // Initial render call handled in auth state change
    render();

  </script>
</body>
</html>
